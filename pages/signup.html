<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Elevate Realty</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="../css/custom_styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
        }
        .text-primary { color: #1a237e; } /* Indigo */
        .btn-primary {
            background-color: #1a237e; /* Indigo */
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #283593; /* Darker Indigo */
        }
        .input-field {
            border: 1px solid #cbd5e0; /* Cool Gray 300 */
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            width: 100%;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-field:focus {
            border-color: #1a237e; /* Indigo */
            box-shadow: 0 0 0 2px rgba(26, 35, 126, 0.2);
            outline: none;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12">
    <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <a href="homepage_3d_immersive_experience.html" class="inline-block mb-4">
                 <div class="w-16 h-16 bg-gradient-to-br from-primary to-indigo-600 rounded-lg flex items-center justify-center mx-auto">
                    <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7v10c0 5.55 3.84 10 9 11 1.09-.87 2-1.76 2.71-2.71-.95-.65-1.71-1.57-1.71-2.29 0-.72.76-1.64 1.71-2.29C14.16 17 18 12.55 18 7L12 2z"/>
                    </svg>
                </div>
            </a>
            <h1 class="text-3xl font-semibold text-primary">Create Your Account</h1>
            <p class="text-gray-600 mt-2">Join Elevate Realty to save favorites and more.</p>
        </div>
        <form id="signupForm" class="space-y-6">
            <div>
                <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="fullName" name="fullName" required class="input-field" placeholder="Your Full Name">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required class="input-field" placeholder="you@example.com">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                <input type="password" id="password" name="password" class="input-field w-full" required>
                <div id="passwordStrength" class="mt-2 hidden">
                    <div class="flex space-x-1 mb-1">
                        <div class="strength-bar h-1 bg-gray-200 rounded flex-1"></div>
                        <div class="strength-bar h-1 bg-gray-200 rounded flex-1"></div>
                        <div class="strength-bar h-1 bg-gray-200 rounded flex-1"></div>
                        <div class="strength-bar h-1 bg-gray-200 rounded flex-1"></div>
                    </div>
                    <p id="passwordStrengthText" class="text-xs text-gray-500">Password strength</p>
                </div>
            </div>
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="input-field w-full" required>
            </div>
            <div>
                <button type="submit" class="btn-primary w-full py-3">Create Account</button>
            </div>
        </form>
        <p class="text-center text-sm text-gray-600 mt-8">
            Already have an account? <a href="login.html" class="text-primary font-medium hover:underline">Login here</a>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signupForm = document.getElementById('signupForm');
            const passwordField = document.querySelector('[name="password"]');
            const confirmPasswordField = document.querySelector('[name="confirmPassword"]');
            const passwordStrengthDiv = document.getElementById('passwordStrength');
            const passwordStrengthText = document.getElementById('passwordStrengthText');
            const strengthBars = document.querySelectorAll('.strength-bar');
            
            // Enhanced form validation configuration
            const validationConfig = {
                fullName: ['required', 'minLength:2', 'maxLength:50'],
                email: ['required', 'email'],
                password: ['required', 'strongPassword'],
                confirmPassword: ['required']
            };

            // Custom validation for password confirmation
            const originalValidateField = window.ElevateRealty.formValidation.validateField;
            window.ElevateRealty.formValidation.validateField = function(field, rules) {
                if (field.name === 'confirmPassword') {
                    const password = passwordField.value;
                    const confirmPassword = field.value;
                    
                    if (!confirmPassword.trim()) {
                        return ['This field is required'];
                    } else if (password !== confirmPassword) {
                        return ['Passwords do not match'];
                    }
                    return [];
                }
                return originalValidateField.call(this, field, rules);
            };

            // Password strength indicator
            function updatePasswordStrength(password) {
                if (!password) {
                    passwordStrengthDiv.classList.add('hidden');
                    return;
                }

                passwordStrengthDiv.classList.remove('hidden');
                
                let strength = 0;
                let feedback = [];

                // Length check
                if (password.length >= 8) strength++;
                else feedback.push('at least 8 characters');

                // Uppercase check
                if (/[A-Z]/.test(password)) strength++;
                else feedback.push('uppercase letter');

                // Lowercase check
                if (/[a-z]/.test(password)) strength++;
                else feedback.push('lowercase letter');

                // Number check
                if (/\d/.test(password)) strength++;
                else feedback.push('number');

                // Special character check
                if (/[@$!%*?&]/.test(password)) strength++;
                else feedback.push('special character');

                // Update strength bars
                strengthBars.forEach((bar, index) => {
                    bar.classList.remove('bg-red-500', 'bg-yellow-500', 'bg-green-500');
                    if (index < strength) {
                        if (strength <= 2) bar.classList.add('bg-red-500');
                        else if (strength <= 3) bar.classList.add('bg-yellow-500');
                        else bar.classList.add('bg-green-500');
                    } else {
                        bar.classList.add('bg-gray-200');
                    }
                });

                // Update text
                const strengthTexts = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong'];
                const colors = ['text-red-500', 'text-red-400', 'text-yellow-500', 'text-green-400', 'text-green-500'];
                
                passwordStrengthText.textContent = strengthTexts[Math.min(strength, 4)];
                passwordStrengthText.className = `text-xs ${colors[Math.min(strength, 4)]}`;
                
                if (feedback.length > 0 && strength < 4) {
                    passwordStrengthText.textContent += ` (needs: ${feedback.slice(0, 2).join(', ')})`;
                }
            }

            // Password strength real-time update
            passwordField.addEventListener('input', (e) => {
                updatePasswordStrength(e.target.value);
            });

            // Setup real-time validation
            window.ElevateRealty.formValidation.setupRealTimeValidation(signupForm, validationConfig);

            // Handle form submission with validation
            window.ElevateRealty.formValidation.handleFormSubmission(
                signupForm,
                async (formData) => {
                    const userData = {
                        fullName: formData.get('fullName'),
                        email: formData.get('email'),
                        password: formData.get('password')
                    };
                    
                    // Simulate API call delay
                    await new Promise(resolve => setTimeout(resolve, 2000));
                    
                    // Check if email already exists (mock check)
                    const existingEmails = ['existing@example.com', 'taken@test.com'];
                    if (existingEmails.includes(userData.email)) {
                        throw new Error('An account with this email already exists');
                    }
                    
                    // Store user data (in real app, this would be sent to backend)
                    localStorage.setItem('isUserLoggedIn', 'true');
                    localStorage.setItem('loggedInUserEmail', userData.email);
                    localStorage.setItem('loggedInUserName', userData.fullName);
                    
                    window.ElevateRealty.showNotification('Account created successfully! Redirecting...', 'success');
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = 'homepage_3d_immersive_experience.html';
                    }, 1500);
                },
                validationConfig
            );

            console.log('Signup page loaded successfully');
        });
    </script>
<script id="dhws-dataInjector" src="../public/dhws-data-injector.js"></script>
<script id="dhws-elementInspector" src="../public/dhws-web-inspector.js"></script>
<script id="dhws-errorTracker" src="../public/dhws-error-tracker.js"></script>
</body>
</html>
